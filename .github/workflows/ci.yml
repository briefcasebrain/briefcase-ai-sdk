name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust (build, test, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo build
        run: cargo build -p briefcase-core --locked

      - name: Cargo test
        run: cargo test -p briefcase-core --locked

      - name: Cargo clippy
        run: cargo clippy -p briefcase-core --locked -- -D warnings

  python:
    name: Python (maturin + pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cover the full supported range declared in pyproject (requires-python >=3.9).
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install maturin and build native extension
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-mock pytest-asyncio pytest-subtests
          maturin build --release --locked
          pip install target/wheels/*.whl

      - name: Smoke-test public submodule imports (real built wheel)
        # Catches native-binding registration regressions that the mocked
        # `tests/` suite cannot see. Run from the repo root, NOT under pytest.
        run: python scripts/check_imports.py

      - name: Run native binding tests (real extension)
        # Separate process: tests/conftest.py mocks briefcase._native globally,
        # so these must not share an interpreter with the facade suite below.
        run: pytest bindings/python/tests/

      - name: Run Python facade tests
        run: pytest tests/
