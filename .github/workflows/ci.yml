name: CI

on:
  push:
  pull_request:
  # publish.yml calls this workflow as its release gate.
  workflow_call:

# Read-only by default; no job in this workflow needs write access.
permissions:
  contents: read

jobs:
  rust:
    name: Rust (build, test, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cargo fmt
        run: cargo fmt --all --check

      # Builds on exactly the declared rust-version, so a dependency bump or a
      # newly stabilized method cannot raise the floor without failing here.
      - name: Build on the declared MSRV
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check -p briefcase-core --locked --all-features

      # --all-features, not a hand-picked set: `sanitize` is not a default
      # feature, so a narrower feature list compiles out the PII-redaction
      # tests and lets a sanitizer regression pass CI green.
      - name: Cargo test
        run: cargo test -p briefcase-core --locked --all-features

      - name: Cargo clippy
        run: cargo clippy -p briefcase-core --locked --all-features -- -D warnings

      # The bindings crate builds a cdylib; `extension-module` is applied by
      # maturin for the wheel, not in Cargo.toml, so a test binary can link
      # libpython and these tests actually run.
      - name: Cargo test (Python bindings crate)
        run: cargo test -p briefcase-python --locked

      - name: Cargo clippy (Python bindings crate)
        run: cargo clippy -p briefcase-python --locked -- -D warnings

      - name: Cargo check and clippy (Node bindings crate)
        run: |
          cargo check -p briefcase-node --locked
          cargo clippy -p briefcase-node --locked -- -D warnings

      # Standalone crate, so no workspace command reaches it. It had drifted to
      # a dependency path that no longer exists and could not build at all.
      - name: Build and run the Rust example
        run: cargo run --manifest-path examples/rust/Cargo.toml

  # Each feature must compile on its own: `--all-features` hides a feature
  # that only builds because another one happens to pull in its dependency.
  # The list is read from the manifest so a new feature is covered without
  # editing this file; the empty entry is the bare `--no-default-features`.
  rust-feature-list:
    name: Rust feature list
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.list.outputs.features }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: list
        run: |
          features=$(cargo metadata --no-deps --format-version 1 \
            | jq -c '[""] + [.packages[] | select(.name == "briefcase-core") | .features | keys[] | select(. != "default")]')
          test "$(jq length <<<"$features")" -gt 1
          echo "features=$features" >> "$GITHUB_OUTPUT"

  rust-features:
    name: Rust feature (${{ matrix.feature || 'none' }})
    needs: rust-feature-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.rust-feature-list.outputs.features) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: feature-${{ matrix.feature || 'none' }}

      - name: Cargo check with only this feature
        env:
          FEATURE: ${{ matrix.feature }}
        run: cargo check -p briefcase-core --locked --no-default-features ${FEATURE:+--features "$FEATURE"}

  # The Python and TypeScript canonical-JSON implementations must produce the
  # same bytes, or a hash written by one cannot be verified by the other.
  # Both are checked against tests/vectors/canonical_json.json; the RFC 8785
  # profile (jcs-1) is also checked in Rust against canonical_json_v2.json.
  canonical-vectors:
    name: Canonical JSON golden vectors (Python + TypeScript + Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: js/runtime/package-lock.json

      # No wheel needed: the script loads the pure-Python canonical module
      # and fails if the committed vectors differ from what it produces.
      - name: Python implementation matches the vectors
        run: |
          python tests/vectors/canonical_json_vectors.py
          python tests/vectors/canonical_json_v2_vectors.py

      - name: TypeScript implementation matches the vectors
        working-directory: js/runtime
        run: |
          npm ci
          npx vitest run test/canonical-vectors.test.ts test/canonical-vectors-v2.test.ts

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Rust implementation matches the RFC 8785 vectors
        run: cargo test -p briefcase-core --locked --test canonical_v2_vectors

  node:
    name: Node ${{ matrix.node-version }} (TypeScript packages)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the package.json files declare in `engines` (Node 26, Active LTS).
        # Node 27 is not released yet; add the next even line here when it ships.
        node-version: ["26"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            js/controls/package-lock.json
            js/runtime/package-lock.json
            js/auto/package-lock.json

      - name: Install, typecheck, test, build, pack
        working-directory: js/controls
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm pack --dry-run

      - name: Install, typecheck, test, build, pack runtime
        working-directory: js/runtime
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm pack --dry-run

      - name: Install, typecheck, test, build, pack auto
        working-directory: js/auto
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm pack --dry-run

  node-native:
    name: Node (native binding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build and test the native binding
        working-directory: bindings/node
        run: |
          npm ci
          npm run build:debug
          npm test

  security:
    name: Security (cargo-deny, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: gitleaks scans every commit, not just the tip.
          fetch-depth: 0
          # The downloaded gitleaks binary runs in this job; keep the
          # workflow token out of its reach.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      # Advisories, licenses, bans, and sources; policy lives in deny.toml.
      - name: Cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources

      - name: Gitleaks history scan
        # Checksum-pinned: the release asset is verified before anything
        # from it executes.
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact --verbose

  python-wheel:
    name: Python wheel (abi3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The wheel is abi3-py39: one build runs on every CPython >=3.9, so the
      # test matrix installs this artifact instead of rebuilding per cell.
      - name: Build the native wheel
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          maturin build --release --locked

      - name: Upload the abi3 wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: abi3-wheel
          path: target/wheels/*.whl
          if-no-files-found: error

      # The sdist is what `pip install briefcase-ai` falls back to on platforms
      # with no wheel, and publish.yml uploads it without building from it.
      # briefcase-core is a path dependency, so a manifest change can make the
      # vendored source tree unbuildable while the in-repo build still works.
      - name: Build a wheel from the sdist
        run: |
          maturin sdist --out dist
          tar xzf dist/*.tar.gz -C dist
          cd dist/briefcase_ai-*/ && maturin build --release
          pip install --force-reinstall target/wheels/*.whl
          cd "$GITHUB_WORKSPACE" && python scripts/check_imports.py

      - name: Check distribution metadata
        # Catches a blank or unrenderable PyPI description before a tag, which
        # the publish action will happily upload. Checks the wheel and sdist
        # built above; nothing is rebuilt here.
        run: |
          pip install twine
          twine check target/wheels/*.whl dist/*.tar.gz

  frameworks:
    name: Auto-instrumentation vs real frameworks
    needs: python-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download built wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: abi3-wheel
          path: target/wheels

      - name: Install wheel and real frameworks
        # The stub-driven suite proves handler behavior; this lane proves the
        # patch points exist in the actual framework releases. pageindex has
        # no public package; its test skips.
        run: |
          python -m pip install --upgrade pip
          pip install target/wheels/*.whl pytest pytest-mock pytest-asyncio pytest-subtests
          pip install "langchain-core>=0.3" "llama-index-core>=0.10" \
            "autogen-agentchat>=0.4" "ag2>=0.4" "openai-agents>=0.1" "crewai>=0.86"

      - name: Run the real-frameworks smoke
        env:
          BRIEFCASE_REAL_FRAMEWORKS: "1"
        run: pytest tests/integrations/frameworks/test_real_frameworks.py -v

  python:
    name: Python (pytest)
    # ubuntu-latest (26.04) has no CPython 3.9 in setup-python's manifest.
    runs-on: ubuntu-24.04
    needs: python-wheel
    strategy:
      fail-fast: false
      matrix:
        # Cover the full supported range declared in pyproject (requires-python >=3.9).
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download the abi3 wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: abi3-wheel
          path: target/wheels

      - name: Install test dependencies and the built wheel
        # moto backs the Glue/KMS suites and pyiceberg/pyarrow the Glue data
        # path; without them those tests skip silently and CI never runs them.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock pytest-asyncio pytest-subtests jsonschema \
            "moto[kms,glue,s3]>=5" "pyiceberg[sql-sqlite,pyiceberg-core]>=0.9" "pyarrow>=14"
          pip install target/wheels/*.whl

      - name: Mypy
        # One version is enough: python_version is pinned in pyproject, so the
        # result does not vary across the matrix.
        if: matrix.python-version == '3.11'
        run: |
          pip install mypy
          mypy briefcase/ briefcase_entry/

      - name: Flake8
        # Config lives in .flake8. One version is enough; the oldest supported
        # interpreter keeps the lint floor at the declared minimum syntax.
        if: matrix.python-version == '3.9'
        run: |
          pip install flake8
          flake8 briefcase/ briefcase_entry/ scripts/ tests/ bindings/python/tests/ examples/

      - name: Check version targets are reconciled
        # A stale target aborts `version_sync.py set` at release time, which is
        # only discovered when a release is already underway. One version is
        # enough: the check reads files, not the interpreter.
        if: matrix.python-version == '3.11'
        run: python scripts/version_sync.py check

      - name: Smoke-test public submodule imports (real built wheel)
        # Catches native-binding registration regressions that the mocked
        # `tests/` suite cannot see. Run from the repo root, NOT under pytest.
        run: python scripts/check_imports.py

      - name: Run native binding tests (real extension)
        # Separate process: tests/conftest.py mocks briefcase._native globally,
        # so these must not share an interpreter with the facade suite below.
        run: pytest bindings/python/tests/

      - name: Run Python facade tests
        run: pytest tests/

      - name: Provider contract tests (pinned API specs, no model calls)
        # tests/contracts validates the provider instrumentation, replay and
        # budget code against OpenAI's OpenAPI spec, the anthropic types, the
        # Gemini discovery document and botocore's Bedrock model. The SDKs are
        # the versions the specs were checked against; see
        # docs/features/provider-contracts.md.
        if: matrix.python-version == '3.11'
        run: |
          pip install "jsonschema>=4.18" openai==3.57.0 anthropic==2.12.0 \
            google-genai==3.6.1 boto3==1.44.9 botocore==1.44.9 httpx
          pytest tests/contracts -q -rs

      # Examples rot silently when nothing runs them. These are offline.
      - name: Run the Python examples
        if: matrix.python-version == '3.11'
        run: |
          pip install "gymnasium>=0.29"
          for f in examples/python-basic/basic_usage.py \
                   examples/validation/basic_validation.py \
                   examples/validation/validation_modes.py \
                   examples/lakefs_versioning/basic_usage.py \
                   examples/multi_agent_correlation/sync_workflow.py \
                   examples/eval_runs/main.py \
                   examples/rl_gym/main.py; do
            echo "--- $f"; python "$f" > /dev/null
          done
          python examples/python-basic/cli_model_example.py --prompt "ci smoke test" > /dev/null
