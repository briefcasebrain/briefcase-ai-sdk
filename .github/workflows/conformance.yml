# Adapter conformance: does `briefcase connect` / `briefcase receive` still work with the
# latest release of each coding tool? Early warning only.
#
#   - runs nightly and on manual dispatch; it is NOT triggered by pushes or pull requests,
#     so it can never block a PR
#   - publishes nothing: the report is a workflow artifact; the shipped
#     briefcase/connect/conformance-report.json is updated by a reviewed PR
#   - the only write permission is `issues: write`, on the final job, to open or update ONE
#     tracking issue when a level changes or a run fails
#
# Local run: python -m scripts.conformance run <tool>   (docs/features/adapter-conformance.md)
name: Adapter conformance

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      tools:
        description: "Space-separated tools to run (default: all CI-installable tools)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: adapter-conformance
  cancel-in-progress: false

env:
  CONFORMANCE_TOOLS: "claude-code codex gemini-cli copilot-cli"

jobs:
  tool:
    name: ${{ matrix.tool }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tool: [claude-code, codex, gemini-cli, copilot-cli]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # `import briefcase` works without the compiled core, and the harness puts the checkout on
      # PYTHONPATH, so there is nothing to build. protobuf lets the receiver decode Codex/Copilot.
      - name: Receiver dependencies
        run: python -m pip install protobuf opentelemetry-proto

      - name: Run conformance for ${{ matrix.tool }}
        env:
          TOOL: ${{ matrix.tool }}
          REQUESTED: ${{ github.event.inputs.tools }}
        run: |
          mkdir -p out
          if [ -n "$REQUESTED" ] && ! printf ' %s ' "$REQUESTED" | grep -q " $TOOL "; then
            echo "skipped by dispatch input" > out/skipped.txt
            exit 0
          fi
          python -m scripts.conformance run "$TOOL" --allow-failures \
            --results-out "out/result-$TOOL.json" | tee "out/$TOOL.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: conformance-${{ matrix.tool }}
          path: out/
          if-no-files-found: ignore

  docs-drift:
    name: docs drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Exit 1 means an expectation vanished from a page that WAS fetched. Network failures are
      # "unknown" and exit 0. Either way the report is uploaded and the report job decides.
      - name: Check documentation pages
        run: |
          mkdir -p out
          python -m scripts.conformance drift --out out/drift.json | tee out/drift.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: conformance-drift
          path: out/

  report:
    name: report and tracking issue
    needs: [tool, docs-drift]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: conformance-*
          path: artifacts
          merge-multiple: false

      - name: Merge into the last known report
        env:
          REQUESTED: ${{ github.event.inputs.tools }}
        run: |
          mkdir -p out
          cp briefcase/connect/conformance-report.json out/previous-report.json
          cp briefcase/connect/conformance-report.json out/conformance-report.json
          expect="${REQUESTED:-$CONFORMANCE_TOOLS}"
          python -m scripts.conformance merge --into out/conformance-report.json \
            --expect "$(echo $expect | tr ' ' ',')" $(ls artifacts/*/result-*.json 2>/dev/null)
          python -m scripts.conformance changes out/previous-report.json out/conformance-report.json > out/changes.txt
          cat out/changes.txt
          cp artifacts/conformance-drift/drift.txt out/drift.txt 2>/dev/null || echo "drift check did not report" > out/drift.txt
          if grep -q "VANISHED" out/drift.txt; then echo vanished > out/drift-flag.txt; fi
          { echo '```'; cat out/drift.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          { echo '```'; cat out/changes.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-report
          path: out/

      # One tracking issue, found by label. Opened or updated only when something changed,
      # failed, or a documentation expectation vanished.
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s out/changes.txt ] && [ ! -f out/drift-flag.txt ]; then
            echo "No level change, no failure, no vanished documentation string."
            exit 0
          fi
          {
            echo "Nightly adapter conformance found something to look at. Run: $RUN_URL"
            echo
            echo "### Level changes and failures"
            echo '```'; cat out/changes.txt; echo '```'
            echo
            echo "### Documentation drift"
            echo '```'; cat out/drift.txt; echo '```'
            echo
            echo "What the levels mean and how to reproduce locally: docs/features/adapter-conformance.md"
            echo "The merged report is attached to the run as the \`conformance-report\` artifact; update"
            echo "\`briefcase/connect/conformance-report.json\` in a reviewed PR."
          } > out/issue-body.md
          gh label create adapter-conformance --color FBCA04 \
            --description "Nightly adapter conformance" 2>/dev/null || true
          existing=$(gh issue list --label adapter-conformance --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file out/issue-body.md
            gh issue comment "$existing" --body "Updated by $RUN_URL"
          else
            gh issue create --label adapter-conformance \
              --title "Adapter conformance: a tool changed or a check failed" --body-file out/issue-body.md
          fi
