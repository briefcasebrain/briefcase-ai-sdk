name: Publish

on:
  push:
    tags:
      - v*
  # Manual trigger: rebuild and (additively) publish artifacts for the version
  # currently in pyproject.toml — used to backfill missing wheels/sdist for an
  # already-released version. Does not re-publish the crate or cut a release.
  workflow_dispatch: {}

# Least privilege at the top; the release job alone gets contents: write.
permissions:
  contents: read

jobs:
  # Publish briefcase-core to crates.io (tag releases only).
  crates-io:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish briefcase-core to crates.io
        # Idempotent on re-runs: tolerate "already published" but surface any
        # other failure (the old `|| echo` masked real publish errors).
        run: |
          if ! cargo publish -p briefcase-core --locked 2>publish_err.log; then
            cat publish_err.log >&2
            if grep -qiE "already (exists|uploaded)|crate version .* is already" publish_err.log; then
              echo "briefcase-core already published at this version; skipping."
            else
              exit 1
            fi
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Build abi3 wheels — one wheel per platform installs on CPython 3.9+.
  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked
          manylinux: auto
          rust-toolchain: stable

      - name: Smoke-test built wheel
        # Only on the host-compatible Linux build; cross-compiled wheels can't
        # run on the build host. Gates publish on a clean import surface.
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip
          pip install target/wheels/*.whl
          python scripts/check_imports.py

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: target/wheels/*.whl

  # Build the source distribution (previously skipped: maturin-action has no
  # `sdist` input — it needs a dedicated `command: sdist` invocation).
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Build the native cost-engine binding for every published platform. The
  # crate has no C dependencies, so plain cargo cross-targets suffice.
  node-binaries:
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native binding
        working-directory: bindings/node
        shell: bash
        run: |
          npm ci
          npx napi build --platform --release --target ${{ matrix.target }}

      - name: Upload binding
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/*.node
          if-no-files-found: error

  # Publish the npm controls package (trusted publishing via OIDC; no token
  # fallback by policy). Prerelease versions publish under the `next` tag so
  # they never take `latest`.
  npm-publish:
    if: github.event_name == 'push'
    needs: [node-binaries]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Build controls
        working-directory: js/controls
        run: |
          npm ci
          npm run build

      - name: Publish @briefcase-ai/controls
        working-directory: js/controls
        run: |
          VERSION=$(jq -r .version package.json)
          TAG=latest
          case "$VERSION" in *-*) TAG=next;; esac
          if npm view "@briefcase-ai/controls@$VERSION" version >/dev/null 2>&1; then
            echo "@briefcase-ai/controls@$VERSION already published; skipping."
          else
            npm publish --provenance --access public --tag "$TAG"
          fi

      - name: Download native bindings
        uses: actions/download-artifact@v4
        with:
          path: bindings/node/artifacts
          pattern: bindings-*
          merge-multiple: true

      - name: Publish @briefcase-ai/native and platform packages
        working-directory: bindings/node
        run: |
          npm ci
          npx napi create-npm-dirs
          npx napi artifacts --output-dir artifacts
          VERSION=$(jq -r .version package.json)
          TAG=latest
          case "$VERSION" in *-*) TAG=next;; esac
          if npm view "@briefcase-ai/native@$VERSION" version >/dev/null 2>&1; then
            echo "@briefcase-ai/native@$VERSION already published; skipping."
          else
            npx napi prepublish -t npm --no-gh-release
            npm publish --provenance --access public --tag "$TAG"
          fi

  # Publish all wheels + sdist to PyPI (trusted publishing).
  pypi-publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Additive: don't fail if some files for this version already exist
          # (lets a manual run backfill missing wheels/sdist).
          skip-existing: true

  # Create a GitHub Release (tag releases only).
  github-release:
    if: github.event_name == 'push'
    needs: [crates-io, pypi-publish, npm-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
