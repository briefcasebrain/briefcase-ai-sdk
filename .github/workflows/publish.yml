name: Publish

on:
  push:
    tags:
      - v*
  # Manual trigger: rebuild and (additively) publish artifacts for the version
  # currently in pyproject.toml — used to backfill missing wheels/sdist for an
  # already-released version. Does not re-publish the crate or cut a release.
  workflow_dispatch: {}

# Least privilege at the top; the release job alone gets contents: write.
permissions:
  contents: read

jobs:
  # Release gate 1: every version string agrees, and on a tag push the tag is
  # that version. Without this a mistyped tag publishes whatever version the
  # manifests hold, under a release named for something else.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Version targets are reconciled
        run: python scripts/version_sync.py check

      - name: Tag matches the version
        if: github.event_name == 'push'
        run: |
          version=$(python scripts/version_sync.py show --canonical-only)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version (expected v$version)"
            exit 1
          fi

  # Release gate 2: the full CI workflow, on the exact commit being released.
  tests:
    uses: ./.github/workflows/ci.yml

  # Publish briefcase-core to crates.io (tag releases only). A crates.io
  # version can never be replaced, so this waits for every build to succeed:
  # a wheel or binding that fails to build must not leave the crate published
  # alone.
  crates-io:
    if: github.event_name == 'push'
    needs: [preflight, tests, wheels, sdist, node-binaries]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Publish briefcase-core to crates.io
        # Idempotent on re-runs: tolerate "already published" but surface any
        # other failure (the old `|| echo` masked real publish errors).
        run: |
          if ! cargo publish -p briefcase-core --locked 2>publish_err.log; then
            cat publish_err.log >&2
            if grep -qiE "already (exists|uploaded)|crate version .* is already" publish_err.log; then
              echo "briefcase-core already published at this version; skipping."
            else
              exit 1
            fi
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Build abi3 wheels — one wheel per platform installs on CPython 3.9+.
  wheels:
    needs: [preflight]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked
          manylinux: auto
          rust-toolchain: stable

      - name: Smoke-test built wheel
        # Only on the native Linux builds (x86_64 and arm64 each build on their own
        # architecture). Gates publish on a clean import surface.
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          python -m pip install --upgrade pip
          pip install target/wheels/*.whl
          python scripts/check_imports.py

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.target }}
          path: target/wheels/*.whl

  # Build the source distribution (previously skipped: maturin-action has no
  # `sdist` input — it needs a dedicated `command: sdist` invocation).
  sdist:
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Build the native cost-engine binding for every published platform. The
  # crate has no C dependencies, so plain cargo cross-targets suffice.
  node-binaries:
    needs: [preflight]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native binding
        working-directory: bindings/node
        shell: bash
        run: |
          npm ci
          npx napi build --platform --release --target ${{ matrix.target }}

      - name: Upload binding
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/*.node
          if-no-files-found: error

  # Publish the npm TypeScript packages (trusted publishing via OIDC; no token
  # fallback by policy). Prerelease versions publish under the `next` tag so
  # they never take `latest`.
  npm-publish:
    # Runs on tag pushes and manual backfills alike; the already-published
    # guards below make it additive either way.
    # Waits for every build, not only its own inputs: a failed wheel build
    # must not leave npm published without PyPI (and vice versa).
    needs: [preflight, tests, wheels, sdist, node-binaries]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"

      # Trusted publishing (OIDC) needs npm >= 11.5.1 and NO auth token in
      # .npmrc: setup-node's registry-url writes an _authToken placeholder
      # that preempts the OIDC exchange and the registry masks it as a 404.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Build controls
        working-directory: js/controls
        run: |
          npm ci
          npm run build

      - name: Publish @briefcase-ai/controls
        working-directory: js/controls
        run: |
          VERSION=$(jq -r .version package.json)
          TAG=latest
          case "$VERSION" in *-*) TAG=next;; esac
          if npm view "@briefcase-ai/controls@$VERSION" version >/dev/null 2>&1; then
            echo "@briefcase-ai/controls@$VERSION already published; skipping."
          else
            npm publish --provenance --access public --tag "$TAG"
          fi

      - name: Build runtime
        working-directory: js/runtime
        run: |
          npm ci
          npm run build

      - name: Publish @briefcase-ai/runtime
        working-directory: js/runtime
        run: |
          VERSION=$(jq -r .version package.json)
          TAG=latest
          case "$VERSION" in *-*) TAG=next;; esac
          if npm view "@briefcase-ai/runtime@$VERSION" version >/dev/null 2>&1; then
            echo "@briefcase-ai/runtime@$VERSION already published; skipping."
          else
            npm publish --provenance --access public --tag "$TAG"
          fi

      - name: Build auto
        working-directory: js/auto
        run: |
          npm ci
          npm run build

      - name: Publish @briefcase-ai/auto
        working-directory: js/auto
        run: |
          VERSION=$(jq -r .version package.json)
          TAG=latest
          case "$VERSION" in *-*) TAG=next;; esac
          if npm view "@briefcase-ai/auto@$VERSION" version >/dev/null 2>&1; then
            echo "@briefcase-ai/auto@$VERSION already published; skipping."
          else
            npm publish --provenance --access public --tag "$TAG"
          fi

      - name: Download native bindings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: bindings/node
          pattern: bindings-*
          merge-multiple: true

      - name: Publish @briefcase-ai/native
        # One package carries every platform binary; the loader picks the
        # matching one at require time.
        working-directory: bindings/node
        run: |
          ls *.node
          VERSION=$(jq -r .version package.json)
          TAG=latest
          case "$VERSION" in *-*) TAG=next;; esac
          if npm view "@briefcase-ai/native@$VERSION" version >/dev/null 2>&1; then
            echo "@briefcase-ai/native@$VERSION already published; skipping."
          else
            npm publish --provenance --access public --tag "$TAG"
          fi

  # Publish all wheels + sdist to PyPI (trusted publishing).
  pypi-publish:
    needs: [preflight, tests, wheels, sdist, node-binaries]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download wheels and sdist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/
          # Wheels and the sdist only; the node-binaries artifacts are .node
          # files that twine rejects as an unknown distribution format.
          pattern: "{wheels-*,sdist}"
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          # Additive: don't fail if some files for this version already exist
          # (lets a manual run backfill missing wheels/sdist).
          skip-existing: true

  # Create a GitHub Release (tag releases only).
  github-release:
    if: github.event_name == 'push'
    needs: [crates-io, pypi-publish, npm-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/
          merge-multiple: true

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
