name: Publish

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  # Publish briefcase-core to crates.io
  crates-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish briefcase-core to crates.io
        # Idempotent on re-runs: tolerate "already published" but surface any
        # other failure (the old `|| echo` masked real publish errors).
        run: |
          if ! cargo publish -p briefcase-core --locked 2>publish_err.log; then
            cat publish_err.log >&2
            if grep -qiE "already (exists|uploaded)|crate version .* is already" publish_err.log; then
              echo "briefcase-core already published at this version; skipping."
            else
              exit 1
            fi
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Build and publish Python wheels to PyPI
  pypi:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sdist: true
          - os: macos-latest
            target: x86_64-apple-darwin
            sdist: false
          - os: macos-latest
            target: aarch64-apple-darwin
            sdist: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sdist: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked -i python3.11
          sdist: ${{ matrix.sdist }}
          manylinux: auto
          rust-toolchain: stable

      - name: Smoke-test built wheel
        # Only on the host-compatible Linux build; cross-compiled wheels can't
        # run on the build host. Gates publish on a clean import surface.
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip
          pip install target/wheels/*.whl
          python scripts/check_imports.py

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: target/wheels/*.whl

      - name: Upload sdist
        if: matrix.sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  # Publish all wheels to PyPI in a single job
  pypi-publish:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Create a GitHub Release
  github-release:
    needs: [crates-io, pypi-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
