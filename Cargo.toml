[workspace]
members = [
    "crates/briefcase-core",
    "bindings/python",
]
resolver = "2"

[workspace.package]
version = "3.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Open-source decision tracking for AI"
repository = "https://github.com/briefcasebrain/briefcase-ai-sdk"
homepage = "https://briefcaseai.io"
authors = ["Briefcase AI"]
keywords = ["ai", "observability", "decision-tracking"]
categories = ["development-tools", "science"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
regex = "1.10"
sha2 = "0.10"
anyhow = "1.0"
thiserror = "2.0"
base64 = "0.22"
futures = "0.3"
pyo3 = { version = "0.24", features = ["extension-module"] }
once_cell = "1.19"
tiktoken-rs = "0.6"
parking_lot = "0.12"
