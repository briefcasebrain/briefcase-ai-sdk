[workspace]
members = [
    "crates/briefcase-core",
    "bindings/python",
    "bindings/node",
]
resolver = "2"

[workspace.package]
version = "4.3.0"
edition = "2021"
# Set by the dependency graph (uuid and getrandom both require 1.85), not by
# taste. CI builds on exactly this toolchain so it cannot drift upward unnoticed.
rust-version = "1.85"
license = "Apache-2.0"
description = "Governance infrastructure for AI decisions: enforce controls, record context, replay later"
repository = "https://github.com/briefcasebrain/briefcase-ai-sdk"
homepage = "https://briefcaseai.io"
authors = ["Briefcase AI"]
keywords = ["ai", "observability", "decision-tracking"]
categories = ["development-tools", "science"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
regex = "1.10"
sha2 = "0.10"
anyhow = "1.0"
thiserror = "2.0"
base64 = "0.22"
futures = "0.3"
# `extension-module` is NOT enabled here: it tells pyo3 to leave Python symbols
# to the host interpreter, which makes every test binary unlinkable. maturin
# supplies it for the wheel via `[tool.maturin] features` in pyproject.toml.
pyo3 = { version = "0.24" }
once_cell = "1.19"
tiktoken-rs = "0.6"
parking_lot = "0.12"
