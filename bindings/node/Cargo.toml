[package]
name = "briefcase-node"
version.workspace = true
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Cost engine only: no storage, tokens, or networking features, so the
# cdylib stays small and carries no C dependencies.
briefcase-core = { path = "../../crates/briefcase-core", default-features = false }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
