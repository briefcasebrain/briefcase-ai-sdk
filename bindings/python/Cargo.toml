[package]
name = "briefcase-python"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Python bindings for Briefcase AI"
documentation = "https://docs.rs/briefcase-python"
publish = false

[lib]
name = "briefcase_native"
crate-type = ["cdylib"]

[dependencies]
briefcase-core = { version = "3.3.1", path = "../../crates/briefcase-core", features = ["replay", "drift", "sanitize", "storage", "otel", "tokens", "networking", "compression"] }
# abi3-py39: build a single stable-ABI wheel that installs on CPython 3.9+.
pyo3 = { workspace = true, features = ["abi3-py39"] }
tokio.workspace = true
serde_json.workspace = true
async-trait = "0.1"
once_cell.workspace = true
