# cargo-deny configuration; CI runs `check advisories licenses bans sources`.

[graph]
# Check every feature combination, not only the defaults: optional
# dependencies (otel, tokens, compression, ...) ship to users who enable them.
all-features = true

[advisories]
ignore = [
    # RUSTSEC-2026-0543: chrono is flagged unmaintained. This is a
    # maintenance notice, not a vulnerability, and no fixed release exists
    # ("No safe upgrade is available"). chrono's `DateTime<Utc>` is part of
    # briefcase-core's public model types and of the SQLite `created_at`
    # format, so replacing it (jiff or time) is a breaking API change to be
    # scheduled with the next major version. Remove this entry with that
    # migration, or sooner if a vulnerability advisory is filed against
    # chrono, which this entry does not cover.
    "RUSTSEC-2026-0543",
]

[licenses]
# Permissive licenses only. A dependency under any other license (copyleft
# included) fails the check until it is reviewed and listed here.
# Derived from `cargo deny check licenses` over the locked graph with all
# features; every entry is in use.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # target-lexicon (pyo3 build)
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",         # ICU4X data crates (url/idna) and unicode-ident
    "CDLA-Permissive-2.0", # webpki-roots: the Mozilla CA bundle, data only
]
confidence-threshold = 0.8

[licenses.private]
# Workspace crates marked `publish = false` (the Node binding crate) are
# never distributed on crates.io and need no license field of their own.
ignore = true

[bans]
# Duplicate versions are reported, not failed: the tree legitimately carries
# several majors of some transitive crates.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside this workspace are not wildcard requirements.
allow-wildcard-paths = true

[sources]
# crates.io only: no git dependencies and no alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
