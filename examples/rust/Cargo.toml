[package]
name = "briefcase-examples"
version = "0.1.0"
edition = "2021"

# Standalone, not a member of the repo workspace: an example should build the
# way a user's crate does, against briefcase-core's own feature defaults.
[workspace]

[dependencies]
briefcase-core = { path = "../../crates/briefcase-core", features = ["drift", "replay", "sanitize", "storage"] }
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
