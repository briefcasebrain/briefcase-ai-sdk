[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "briefcase-ai"
version = "4.3.0"
description = "Governance infrastructure for AI decisions: enforce controls, record context, replay later"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Briefcase AI" }]
keywords = ["ai", "observability", "decision-tracking", "replay", "drift"]
# These drive PyPI's search filters and the "supported versions" sidebar, so
# they track what CI actually tests and what publish.yml actually builds.
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://briefcaseai.io"
Repository = "https://github.com/briefcasebrain/briefcase-ai-sdk"
Changelog = "https://github.com/briefcasebrain/briefcase-ai-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/briefcasebrain/briefcase-ai-sdk/issues"

[project.optional-dependencies]
replay = []
drift = []
sanitize = []
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
storage = []
validate = []
guardrails = []
rag = []
rag-chroma = ["chromadb>=0.4"]
rag-pinecone = ["pinecone>=3"]
# weaviate-client v4 removed weaviate.Client, which the adapter is built on.
rag-weaviate = ["weaviate-client>=3,<4"]
correlation = []
external = []
events = []
kafka = ["confluent-kafka>=2.3"]
# The webhook transport is stdlib urllib; the extra exists for discoverability.
webhook = []
gcp-logging = ["google-cloud-logging>=3.9"]
routing = []
opa = ["httpx>=0.24"]
lakefs = ["lakefs>=0.1"]
vcs = []
# Per-provider VCS adapter clients; git-LFS, Nessie, and ArtiVC adapters are
# HTTP/subprocess based and need no extra.
vcs-dvc = ["dvc>=3"]
vcs-pachyderm = ["pachyderm-sdk>=2.8"]
vcs-ducklake = ["duckdb>=0.9"]
vcs-iceberg = ["pyiceberg>=0.9"]
gym = ["gymnasium>=0.29"]
# The parsers themselves are stdlib only. inspect-ai writes .eval archives with
# zstd-compressed zip entries (method 93), which stdlib zipfile decodes only on
# Python 3.14+; the backend is loaded lazily, so a bare install still imports
# and still reads .json logs and lm-eval results.
evals = ["zstandard>=0.22; python_version < '3.14'"]
bitemporal = []
bitemporal-iceberg = ["pyiceberg[sql-sqlite,pyiceberg-core]>=0.9", "pyarrow>=14"]
# AWS Glue catalog auth for the Iceberg backend, and KMS signing for examiner
# bundles. Both run against customer-owned AWS resources.
bitemporal-glue = ["briefcase-ai[bitemporal-iceberg]", "boto3>=1.34"]
compliance-kms = ["boto3>=1.34"]
# pykx is KX-licensed, so the kdb backend is opt-in only and deliberately
# excluded from `all`.
kdb = ["pykx>=2.5"]
compliance = []
controls = []
# Ed25519 signing for hash-chain entries and JSON manifests; the chain and
# canonical-JSON helpers themselves are stdlib-only.
integrity = ["pynacl>=1.5"]
# Framework auto-instrumentation handlers; each imports its framework lazily.
langchain = ["langchain-core>=0.3"]
crewai = ["crewai>=0.86"]
llamaindex = ["llama-index-core>=0.10"]
autogen = ["autogen-agentchat>=0.4"]
ag2 = ["ag2>=0.4"]
pageindex = ["pageindex>=0.1"]
openai-agents = ["openai-agents>=0.1"]
# mcp 2.0 removed mcp.server.fastmcp, which briefcase.mcp is built on, so the
# floor alone was not enough: a fresh install resolved 2.x and broke the extra.
mcp = ["mcp>=1.2,<2"]
# The `briefcase` evaluation-run CLI talks to oci-jj-server over gRPC, discovering the schema via
# server reflection (no generated stubs). grpcio-reflection is the PyPI wheel; the import is
# grpc_reflection.v1alpha. The subprocess oci-jj fallback (BRIEFCASE_ENGINE=cli) needs none of these.
run = ["grpcio>=1.60,<2", "grpcio-reflection>=1.60,<2", "protobuf>=4.25"]
# No black: the codebase is not black-formatted and CONTRIBUTING says not to
# run it, so shipping it as a dev dependency only invites a 95-file diff.
dev = [
    "pytest",
    "pytest-mock",
    "pytest-asyncio",
    "pytest-subtests",
    "mypy",
    "flake8",
    # moto backs the Glue and KMS tests; those suites skip cleanly without it.
    "moto[kms,glue,s3]>=5",
]
all = ["briefcase-ai[replay,drift,sanitize,otel,storage,validate,guardrails,rag,rag-chroma,rag-pinecone,rag-weaviate,correlation,external,events,kafka,webhook,gcp-logging,routing,opa,lakefs,vcs,vcs-dvc,vcs-pachyderm,vcs-ducklake,vcs-iceberg,gym,evals,bitemporal,bitemporal-iceberg,bitemporal-glue,compliance,compliance-kms,controls,integrity,langchain,crewai,llamaindex,autogen,ag2,pageindex,openai-agents,mcp,run]"]

[project.scripts]
briefcase-mcp = "briefcase.mcp.__main__:main"
briefcase = "briefcase.cli.__main__:main"

[tool.pytest.ini_options]
# `tests/` mocks briefcase._native process-wide, so it cannot share an
# interpreter with bindings/python/tests/ (which needs the real extension).
# A bare `pytest` therefore collects only the facade suite; CI passes each
# path explicitly, and an explicit path overrides testpaths.
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "integration: marks tests requiring external services",
]
filterwarnings = [
    "ignore::pytest.PytestUnknownMarkWarning",
]

[tool.mypy]
python_version = "3.9"
# Enforced in CI. Not strict mode: most of the codebase predates annotations, so
# the gate is "no new type errors", not "everything is typed".
#
# warn_unused_ignores stays off on purpose. Optional-dependency shims like
# briefcase/_otel.py need `# type: ignore[assignment]` when the package is
# installed and not when it is absent, so the setting makes the result depend on
# which extras happen to be present.
exclude = "^(tests|examples|bindings/python/tests)/"

# Modules with no type information, for two distinct reasons: a compiled
# extension (briefcase._native) and optional dependencies the extras gate
# (pyiceberg, pyarrow, grpc, protobuf, framework and store clients).
[[tool.mypy.overrides]]
module = [
    "briefcase._native",
    "pyiceberg.*",
    "pyarrow.*",
    "opentelemetry.*",
    "grpc",
    "grpc_reflection.*",
    "google.protobuf.*",
    "lakefs.*",
    "mcp.*",
    "gymnasium.*",
    # numpy arrives only with gymnasium, so it is absent from a bare install.
    "numpy",
    "zstandard",
    "pyzstd",
    "pykx.*",
    "boto3.*",
    "botocore.*",
    "moto.*",
    "httpx",
    "confluent_kafka.*",
    "google.cloud.*",
    "google.oauth2.*",
    "langchain_core.*",
    "llama_index.*",
    "crewai.*",
    "autogen.*",
    "autogen_agentchat.*",
    "agents.*",
    "pageindex.*",
    "chromadb.*",
    "pinecone.*",
    "weaviate.*",
    "dvc.*",
    "duckdb.*",
    "pachyderm_sdk.*",
]
ignore_missing_imports = true
# Do not analyze inside third-party packages: several ship py.typed and use
# syntax newer than this project's floor, which would fail the run on their
# source rather than ours.
follow_imports = "skip"

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "bindings/python/Cargo.toml"
module-name = "briefcase._native"
python-source = "."
# Bundle the license files into the sdist/wheel. maturin declares
# `License-File: LICENSE` in the metadata, so the file must be present or PyPI
# rejects the upload with a 400.
#
# The `briefcase stack` command and `briefcase doctor` read these data files at runtime via
# importlib.resources; maturin only ships non-.py files that are listed here, so they MUST be
# enumerated explicitly (a missing entry silently drops them from the wheel — see check_imports.py).
include = [
    "LICENSE",
    "NOTICE",
    "briefcase/cli/stack/docker-compose.yml",
    "briefcase/cli/stack/compat.json",
]
