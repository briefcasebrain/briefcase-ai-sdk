# Canonical version reconciliation map for release automation.
# Keep exactly one canonical target.

[[targets]]
id = "workspace"
path = "Cargo.toml"
pattern = '(?m)^(?P<pre>version = ")(?P<version>[^"]+)(?P<post>")$'
replacement = '{pre}{version}{post}'
canonical = true

[[targets]]
id = "pyproject"
path = "pyproject.toml"
pattern = '(?m)^(?P<pre>version = ")(?P<version>[^"]+)(?P<post>")$'
replacement = '{pre}{version}{post}'

[[targets]]
id = "python_init_version"
path = "briefcase/__init__.py"
pattern = '(?m)^(?P<pre>__version__ = ")(?P<version>[^"]+)(?P<post>")$'
replacement = '{pre}{version}{post}'

# No target for bindings/python/src/lib.rs: `__version__` there is
# env!("CARGO_PKG_VERSION"), and bindings/python/Cargo.toml sets
# `version.workspace = true`, so it already resolves to the canonical version.

[[targets]]
id = "python_binding_core_dep"
path = "bindings/python/Cargo.toml"
pattern = '(?P<pre>briefcase-core = \{ version = ")(?P<version>[^"]+)(?P<post>")'
replacement = '{pre}{version}{post}'

# The compat manifest the `briefcase` CLI ships: its briefcase_ai field is the SDK's own version and
# must track the canonical version. (oci_jj_image_tag is oci-jj's version and is intentionally NOT a
# target — it tracks the oci-jj release the SDK is pinned to.)
[[targets]]
id = "compat_briefcase_ai"
path = "briefcase/cli/stack/compat.json"
pattern = '(?P<pre>"briefcase_ai": ")(?P<version>[^"]+)(?P<post>")'
replacement = '{pre}{version}{post}'
